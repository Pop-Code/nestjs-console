name: Test

on:
    # Trigger the workflow on push or pull request,
    # but only for the master branch
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Node 22 is supported at runtime (>=22.12, require(esm)), but Jest can only
                # load the ESM-only NestJS 12 / commander 15 packages on Node >= 24.9,
                # so the Jest suite runs on 24+ and Node 22 runs the smoke test only.
                node-version: [22.x, 24.x, 26.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: yarn
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Lint
              run: yarn run lint
            - name: Build
              run: yarn run build
            - name: Smoke test (built package + CLI)
              run: yarn run test:smoke
            - name: Test
              if: ${{ matrix.node-version != '22.x' }}
              run: yarn run test:cov
            - name: Codecov
              if: ${{ matrix.node-version == '24.x' }}
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/coverage-final.json
                  fail_ci_if_error: true

    # The build job tests the latest versions (NestJS 12, commander 15),
    # this one tests the other supported majors of the peer dependencies.
    compatibility:
        name: NestJS ${{ matrix.nest }} / commander ${{ matrix.commander }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - nest: 9
                      commander: 11
                    - nest: 10
                      commander: 12
                    - nest: 11
                      commander: 13
                    - nest: 12
                      commander: 14

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: yarn
            - name: Install
              run: |
                  yarn install --frozen-lockfile
                  yarn add --dev --ignore-scripts \
                      @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} \
                      @nestjs/testing@^${{ matrix.nest }} @nestjs/platform-express@^${{ matrix.nest }} \
                      commander@~${{ matrix.commander }}.0.0
            - name: Build
              run: yarn run build
            - name: Test
              run: yarn run test
